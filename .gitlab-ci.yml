stages:
  - lint
  - test

default:
  image: python:3.14-slim

ruff:
  stage: lint
  script:
    - pip install ruff
    - ruff check tests
    - ruff format --check tests

# One Python, and not by choice. pytest-homeassistant-custom-component pins one
# exact Home Assistant release, and 2026.7.4 requires Python 3.14, so there is
# no matrix to run. The engine is separately tested from 3.11 upward in
# pygtfsie, which has no such constraint -- which is most of why it is a
# separate package.
pytest:
  stage: test
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends git
  script:
    - pip install -r requirements_test.txt
    - pytest -q

# The same rule as pygtfsie: no test may depend on the current time. It matters
# more here than it looks, because these fixtures are what every later test
# states its case through, and a builder that behaved differently after 22:00
# would take a whole suite with it.
time-sweep:
  stage: test
  before_script:
    # git as well as faketime: the engine is installed from a git URL until it
    # is published, and the slim image ships neither.
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends faketime git
    - pip install -r requirements_test.txt
  script:
    - scripts/time-sweep.sh
